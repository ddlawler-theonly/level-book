<!doctype html>
<html lang="en" data-theme="sunlight">
<head>

<title>Level Book</title>
<meta name="description" content="Offline differential leveling field book – US decimal feet">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Level Book">

<script>
  // Apply the saved theme before first paint; iOS reads the status-bar meta at launch only.
  try { if (localStorage.getItem('lb.theme') === 'dusk') { document.documentElement.dataset.theme = 'dusk';
    document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = 'black-translucent';
    document.querySelector('meta[name="theme-color"]').content = '#121417'; } } catch (e) {}
</script>

<script src="vendor/jspdf.umd.min.js" defer></script>

</head>
